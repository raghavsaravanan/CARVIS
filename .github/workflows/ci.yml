name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Check tracked secret and local-data paths
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env($|\.)|VapiConfig\.plist$|carvis_mvp_db/|node_modules/|xcuserdata/|__pycache__/)|\.(pdf|pem|p12)$'
          if git ls-files | grep -E "$forbidden"; then
            echo "Tracked secret, local-data, cache, or private-document path found." >&2
            exit 1
          fi
          private_key='BEGIN ''(RSA |EC |OPENSSH )?PRIVATE KEY'
          github_token='github''_pat_[A-Za-z0-9_]{20,}|gh''p_[A-Za-z0-9]{20,}'
          provider_key='sk_''(live|test)_[A-Za-z0-9]{16,}'
          if git grep -I -n -E "$private_key|$github_token|$provider_key" -- . ':!docs/archive/**'; then
            echo "Possible committed credential found." >&2
            exit 1
          fi

      - name: Check repository structure and whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          test ! -d frontend
          test ! -d carvis-module
          test -f backend/spacetimedb/module/src/index.ts
          test -f ios/Carvis/Carvis.xcodeproj/project.pbxproj
          test -f ios/Tests/ConversationMachineTests.swift

      - name: Validate Apple property lists
        run: |
          python - <<'PY'
          import plistlib
          from pathlib import Path

          for name in ("ios/Carvis/Carvis-Info.plist", "ios/Carvis/Carvis.entitlements"):
              with Path(name).open("rb") as source:
                  plistlib.load(source)
          PY

  swift:
    name: Swift pure checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Report Swift toolchain
        run: swift --version

      - name: Conversation state machine
        run: |
          swiftc ios/Carvis/Carvis/Assistant/ConversationMachine.swift \
            ios/Tests/ConversationMachineTests.swift \
            -o /tmp/carvis-conversation-tests
          /tmp/carvis-conversation-tests

      - name: Voice session controller
        run: |
          swiftc ios/Carvis/Carvis/Assistant/VoiceSessionController.swift \
            ios/Tests/VoiceSessionControllerTests.swift \
            -o /tmp/carvis-voice-session-tests
          /tmp/carvis-voice-session-tests

      - name: Phone audio route policy
        run: |
          swiftc ios/Carvis/Carvis/Speech/PhoneAudioRoutePolicy.swift \
            ios/Tests/PhoneAudioRoutePolicyTests.swift \
            -o /tmp/carvis-phone-route-tests
          /tmp/carvis-phone-route-tests

      - name: Wake phrase matcher
        run: |
          swiftc ios/Carvis/Carvis/Glasses/WakePhraseMatcher.swift \
            ios/Tests/WakePhraseMatcherTests.swift \
            -o /tmp/carvis-wake-tests
          /tmp/carvis-wake-tests

  spacetimedb:
    name: SpacetimeDB typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/spacetimedb/module
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/spacetimedb/module/package-lock.json

      - name: Install pinned dependencies
        run: npm ci

      - name: Typecheck module
        run: ./node_modules/.bin/tsc --project tsconfig.json --noEmit
