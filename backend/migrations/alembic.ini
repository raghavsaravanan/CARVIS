# Alembic configuration for the Carvis PostgreSQL schema (M2 B1, ADR-0001).
# The database URL is never stored here: env.py reads CARVIS_MIGRATION_DATABASE_URL.
# Usage (from backend/): alembic -c migrations/alembic.ini upgrade head
[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/..
path_separator = os
revision_environment = false
