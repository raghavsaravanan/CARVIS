name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only pull-request runs are cancelled by a newer run; full runs on main, schedule and dispatch always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Required checks (branch protection): "Backend and hygiene", "Swift pure checks", "SpacetimeDB typecheck". They are
# the gate jobs at the end, which always run and pass only if every job they need succeeded or was skipped for a
# reason the plan states (scripts/ci-gate.py). Work jobs have other names, because a skipped job counts as passing.

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.categories.outputs.full }}
      backend: ${{ steps.categories.outputs.backend }}
      ios: ${{ steps.categories.outputs.ios }}
      spacetimedb: ${{ steps.categories.outputs.spacetimedb }}
      deps: ${{ steps.categories.outputs.deps }}
      lockfile: ${{ steps.categories.outputs.lockfile }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Categorize changed paths (fail-closed)
        id: categories
        shell: bash  # bash -eo pipefail: a failing plan script fails the step despite the pipe into tee
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-plan.py categories --event "${EVENT}" --base "${BASE}" --head "${HEAD}" | tee -a "${GITHUB_OUTPUT}"

  hygiene:
    name: Hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tracked secret and local-data paths
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env($|\.)|VapiConfig\.plist$|carvis_mvp_db/|node_modules/|xcuserdata/|__pycache__/)|\.(pdf|pem|p12)$'
          if git ls-files | grep -E "$forbidden"; then
            echo "Tracked secret, local-data, cache, or private-document path found." >&2
            exit 1
          fi
          private_key='BEGIN ''(RSA |EC |OPENSSH )?PRIVATE KEY'
          github_token='github''_pat_[A-Za-z0-9_]{20,}|gh''p_[A-Za-z0-9]{20,}'
          provider_key='sk_''(live|test)_[A-Za-z0-9]{16,}'
          if git grep -I -n -E "$private_key|$github_token|$provider_key" -- . ':!docs/archive/**'; then
            echo "Possible committed credential found." >&2
            exit 1
          fi

      - name: Check whitespace in the change
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE}" ]]; then git diff --check "${BASE}" HEAD; else git diff --check HEAD^ HEAD; fi

      - name: Check repository structure
        shell: bash
        run: |
          set -euo pipefail
          test ! -d frontend
          test ! -d carvis-module
          test -f backend/spacetimedb/module/src/index.ts
          test -f ios/Carvis/Carvis.xcodeproj/project.pbxproj
          test -f ios/Tests/ConversationMachineTests.swift

      - name: Validate Apple property lists
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          for name in ("ios/Carvis/Carvis-Info.plist", "ios/Carvis/Carvis.entitlements"):
              with Path(name).open("rb") as source:
                  plistlib.load(source)
          PY

      - name: Documentation links and stale paths
        run: bash scripts/check-docs.sh

      - name: Review packet tests
        run: bash scripts/tests/review-scope-test.sh

      - name: Workflow script tests
        run: |
          bash scripts/tests/check-disk-space-test.sh
          bash scripts/tests/ci-scripts-test.sh

  lockfile:
    name: Runtime lockfile
    needs: plan
    if: needs.plan.outputs.lockfile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify runtime lockfile and imports in isolation
        run: bash scripts/check-runtime-lock.sh python

  unit:
    name: Backend tests (unit)
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No PostgreSQL service: a database test assigned here fails instead of skipping.
    env:
      CARVIS_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-dev.txt
      - name: Every collected test is in exactly one shard
        run: python scripts/ci-plan.py partition
      - name: Workflow structure
        run: python scripts/tests/ci-workflow-test.py
      - name: Run unit tests
        run: python -m pytest -q --junitxml=/tmp/junit.xml $(python scripts/ci-plan.py shard unit)
      - name: No test skipped, errored or missing
        run: python scripts/ci-plan.py junit /tmp/junit.xml
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Alembic history is linear (single head)
        working-directory: backend
        run: python -m db.history

  db-1:
    name: Backend tests (db-1)
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_PASSWORD: ci-scratch-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CARVIS_TEST_POSTGRES_URL: postgresql://postgres:ci-scratch-only@127.0.0.1:5432/postgres
      CARVIS_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-dev.txt
      - name: Run database tests
        run: python -m pytest -q --junitxml=/tmp/junit.xml $(python scripts/ci-plan.py shard db-1)
      - name: No test skipped, errored or missing
        run: python scripts/ci-plan.py junit /tmp/junit.xml
      - name: Migrations up, down and up as a non-superuser CREATEROLE login
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          admin="${CARVIS_TEST_POSTGRES_URL}"
          psql "${admin}" -v ON_ERROR_STOP=1 -qc "CREATE ROLE ci_migrator LOGIN CREATEROLE PASSWORD 'ci-scratch-only'"
          psql "${admin}" -v ON_ERROR_STOP=1 -qc "CREATE DATABASE carvis_ci OWNER ci_migrator"
          export CARVIS_MIGRATION_DATABASE_URL="postgresql://ci_migrator:ci-scratch-only@127.0.0.1:5432/carvis_ci"
          db="postgresql://postgres:ci-scratch-only@127.0.0.1:5432/carvis_ci"
          # pg_dump 16.10+ writes a random \restrict key per dump; drop those lines before comparing.
          dump() { pg_dump --schema-only "${db}" | grep -v -E '^\\(un)?restrict '; }
          python -m alembic -c migrations/alembic.ini upgrade head
          dump > /tmp/schema-first.sql
          psql "${admin}" -At -c "SELECT rolname, rolcanlogin, rolsuper, rolbypassrls FROM pg_roles WHERE rolname LIKE 'carvis%' ORDER BY 1" > /tmp/roles-first.txt
          python -m alembic -c migrations/alembic.ini downgrade base
          test -z "$(psql "${admin}" -At -c "SELECT rolname FROM pg_roles WHERE rolname LIKE 'carvis%'")"
          python -m alembic -c migrations/alembic.ini upgrade head
          dump > /tmp/schema-second.sql
          psql "${admin}" -At -c "SELECT rolname, rolcanlogin, rolsuper, rolbypassrls FROM pg_roles WHERE rolname LIKE 'carvis%' ORDER BY 1" > /tmp/roles-second.txt
          diff -u /tmp/schema-first.sql /tmp/schema-second.sql
          diff -u /tmp/roles-first.txt /tmp/roles-second.txt
          test "$(python -m alembic -c migrations/alembic.ini heads | wc -l)" -eq 1

  db-2:
    name: Backend tests (db-2)
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_PASSWORD: ci-scratch-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CARVIS_TEST_POSTGRES_URL: postgresql://postgres:ci-scratch-only@127.0.0.1:5432/postgres
      CARVIS_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-dev.txt
      - name: Run database tests
        run: python -m pytest -q --junitxml=/tmp/junit.xml $(python scripts/ci-plan.py shard db-2)
      - name: No test skipped, errored or missing
        run: python scripts/ci-plan.py junit /tmp/junit.xml

  db-3:
    name: Backend tests (db-3)
    needs: plan
    if: needs.plan.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_PASSWORD: ci-scratch-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CARVIS_TEST_POSTGRES_URL: postgresql://postgres:ci-scratch-only@127.0.0.1:5432/postgres
      CARVIS_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r backend/requirements-dev.txt
      - name: Run database tests
        run: python -m pytest -q --junitxml=/tmp/junit.xml $(python scripts/ci-plan.py shard db-3)
      - name: No test skipped, errored or missing
        run: python scripts/ci-plan.py junit /tmp/junit.xml

  swift:
    name: Swift tests
    needs: plan
    if: needs.plan.outputs.ios == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Report Swift toolchain
        run: swift --version

      - name: Conversation state machine
        run: |
          swiftc ios/Carvis/Carvis/Assistant/ConversationMachine.swift \
            ios/Tests/ConversationMachineTests.swift \
            -o /tmp/carvis-conversation-tests
          /tmp/carvis-conversation-tests

      - name: Voice session controller
        run: |
          swiftc ios/Carvis/Carvis/Assistant/VoiceSessionController.swift \
            ios/Tests/VoiceSessionControllerTests.swift \
            -o /tmp/carvis-voice-session-tests
          /tmp/carvis-voice-session-tests

      - name: Phone audio route policy
        run: |
          swiftc ios/Carvis/Carvis/Speech/PhoneAudioRoutePolicy.swift \
            ios/Tests/PhoneAudioRoutePolicyTests.swift \
            -o /tmp/carvis-phone-route-tests
          /tmp/carvis-phone-route-tests

      - name: Wake phrase matcher
        run: |
          swiftc ios/Carvis/Carvis/Glasses/WakePhraseMatcher.swift \
            ios/Tests/WakePhraseMatcherTests.swift \
            -o /tmp/carvis-wake-tests
          /tmp/carvis-wake-tests

  spacetimedb:
    name: SpacetimeDB module typecheck
    needs: plan
    if: needs.plan.outputs.spacetimedb == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/spacetimedb/module
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/spacetimedb/module/package-lock.json

      - name: Install pinned dependencies
        run: npm ci

      - name: Typecheck module
        run: ./node_modules/.bin/tsc --project tsconfig.json --noEmit

  # --- required checks: gates (always run; scripts/ci-gate.py) ---------------------------------------------------

  gate-backend:
    name: Backend and hygiene
    needs: [plan, hygiene, lockfile, unit, db-1, db-2, db-3]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-gate.py backend "${NEEDS}"

  gate-swift:
    name: Swift pure checks
    needs: [plan, swift]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-gate.py swift "${NEEDS}"

  gate-spacetimedb:
    name: SpacetimeDB typecheck
    needs: [plan, spacetimedb]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-gate.py spacetimedb "${NEEDS}"
